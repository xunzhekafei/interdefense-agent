name: tests

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连推多次时，取消掉还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败也让另一个跑完，一次看清两边的情况
      fail-fast: false
      matrix:
        # 本项目在 Windows 上开发，agent.py 里有 GBK 解码等平台相关分支，两个平台都要跑
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # 锁文件固定了验证过的版本组合，避免上游更新让 CI 突然变红
          cache-dependency-path: requirements-lock.txt

      - name: 安装依赖
        run: pip install -r requirements-lock.txt

      # 不需要任何密钥：pytest.ini 默认排除 slow 标记的真实 API 冒烟测试，
      # conftest.py 会给 ANTHROPIC_API_KEY 兜一个假值。约 2 秒跑完。
      - name: 离线测试
        run: python -m pytest
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 与本地验证过的版本保持一致，避免上游更新改变规则集
      - name: 安装 ruff
        run: pip install "ruff==0.15.15"

      - name: 静态检查
        run: ruff check backend tests tools settings.py interview_spec.py cron_utils.py

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: lint
        run: npm run lint
      - name: 单元测试
        run: npm run test
      - name: 类型检查 + 构建
        run: npm run build
